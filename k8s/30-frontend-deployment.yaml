# Frontend (React compilado, servido por nginx) com 2 replicas.
# O nginx tambem faz o papel de proxy reverso: /api -> Service backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    projeto: reserva-salas
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        projeto: reserva-salas
        app: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: reserva-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: reserva-config
                  key: BACKEND_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
