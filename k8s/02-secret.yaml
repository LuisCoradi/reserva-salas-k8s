# Dados sensiveis: usuario e senha do banco.
# "stringData" aceita texto puro; o Kubernetes guarda em base64.
# Observacao: base64 nao e criptografia. Em producao isso viria de um cofre
# (ex.: Sealed Secrets, External Secrets, AWS Secrets Manager) e nao do Git.
apiVersion: v1
kind: Secret
metadata:
  name: reserva-secret
  labels:
    projeto: reserva-salas
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: adminpassword
