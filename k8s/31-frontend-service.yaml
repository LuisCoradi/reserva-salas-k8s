# Unico ponto de entrada da aplicacao.
# NodePort expoe a porta 30080 no no do Minikube;
# no Windows o acesso e feito com "minikube service frontend --url".
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    projeto: reserva-salas
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
